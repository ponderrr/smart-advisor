# Flutter gen_l10n config. Source .arb files live in lib/l10n/; the
# generated AppLocalizations class is emitted into the build dir and
# imported as `package:flutter_gen/gen_l10n/app_localizations.dart`.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
