<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline — Smart Advisor</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        background: #0a0a0a;
        color: #fafafa;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 1.375rem;
        font-weight: 700;
        margin: 0;
      }
      p {
        margin: 0;
        max-width: 28rem;
        line-height: 1.6;
        color: #a1a1aa;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.7rem 1.5rem;
        border: 0;
        border-radius: 0.625rem;
        background: #6366f1;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #5855eb;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="/icons/icon-192.png" alt="Smart Advisor" />
    <h1>You're offline</h1>
    <p>
      Smart Advisor needs an internet connection to build your personalized
      recommendations. Check your connection and try again.
    </p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
